name: Infra AWS de desenvolvimento

on:
  workflow_dispatch:
    inputs:
      executar_apply:
        description: "Criar ou atualizar os recursos na AWS?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: aws-dev

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Diagnosticar identidade OIDC
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for name in ["aud", "sub", "repository", "ref", "environment"]:
              print(f"{name}: {claims.get(name, '(ausente)')}")
          PY
                  
      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Preparar Terraform
        run: terraform init -input=false

      - name: Conferir formatação
        run: terraform fmt -check

      - name: Validar configuração
        run: terraform validate

      - name: Planejar alterações
        run: terraform plan -input=false -out=change.tfplan

      - name: Aplicar alterações
        if: ${{ inputs.executar_apply }}
        run: terraform apply -input=false change.tfplan

      - name: Mostrar lockfile
        run: cat .terraform.lock.hcl